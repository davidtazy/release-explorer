<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      try {
        const preference = localStorage.getItem('gitlab-release-explorer.theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = preference === 'dark' || (preference !== 'light' && systemDark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/rocket.svg">
    <meta name="theme-color" content="#0b1f3a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Read-only GitLab release explorer: latest release per project, with a persistent, timestamped cache."
    >
    <title>GitLab Release Explorer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
